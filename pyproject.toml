[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-matcher"
version = "0.1.0"
description = "CLI tool to scan saved jobs, score against resume, and add matches to Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.2",
    "en-core-web-lg",
    "google-api-python-client>=2.193.0",
    "google-auth-oauthlib>=1.3.1",
    "litellm>=1.83.0",
    "pdfplumber>=0.11",
    "playwright>=1.58.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "spacy>=3.7",
]

[project.scripts]
job-matcher = "main:main"

[tool.hatch.build.targets.wheel]
# Listing packages under src/ tells hatchling the package root is src/,
# so the editable install adds src/ to sys.path — making browser/, db/,
# and standalone modules (main.py, config.py, etc.) all importable unchanged.
packages = ["src/browser", "src/db", "src/matcher", "src/sheets"]
sources = ["src"]
include = [
    "src/main.py",
    "src/config.py",
    "src/lambda_handler.py",
    "src/notifications.py",
]

[tool.uv]
package = true

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
]
