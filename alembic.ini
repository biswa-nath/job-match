# Developer CLI config only (`uv run alembic revision -m "..."`, `alembic current`).
# At runtime init_db() configures Alembic in code, so this file is not shipped.
[alembic]
script_location = src/db/migrations

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
